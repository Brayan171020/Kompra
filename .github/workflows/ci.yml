name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CI: true
  NODE_ENV: test
  PORT: 4000
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kompra_test
  BETTER_AUTH_SECRET: test-secret-key-must-be-at-least-32-chars-long-123456
  BETTER_AUTH_URL: http://localhost:4000/api/v1/auth
  TRUSTED_ORIGINS: http://localhost:3000
  NEXT_PUBLIC_API_URL: http://localhost:4000

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kompra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build API (NestJS)
        run: pnpm --filter api run build

      - name: Build Web (Next.js)
        run: pnpm --filter web run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

      - name: Typecheck API
        run: pnpm --filter api run lint

      - name: Typecheck Web
        run: pnpm --filter web run lint

      - name: Run API Unit Tests
        run: pnpm --filter api run test -- --coverage

      # apps/web has no test script yet; the workspace filter prevents Jest from
      # being invoked in a package without a configured test runner.
      - name: Run API E2E Tests
        run: pnpm --filter api run test:e2e
